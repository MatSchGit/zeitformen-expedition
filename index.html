const KEY='zeitformen-expedition-v1';let progress;try{progress=JSON.parse(localStorage.getItem(KEY))||{}}catch{progress={}}let world=null,idx=0,score=0,answered=false;const app=document.getElementById('app');function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch{}stats()}function stats(){let stars=Object.values(progress).reduce((a,b)=>a+(b.stars||0),0);document.getElementById('totalStars').textContent='⭐ '+stars+' Sterne';document.getElementById('completed').textContent='🏅 '+Object.keys(progress).filter(k=>progress[k]?.done).length+' von 5 Welten gemeistert'}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function home(){world=null;app.innerHTML='<div class="worlds">'+worlds.map(w=>{let p=progress[w.id];return `<button class="world" data-world="${w.id}"><div class="emoji">${w.emoji}</div><h2>${w.name}</h2><p>${w.sub}</p><small>${p?.done?'🏅 Geschafft · '+p.stars+' ⭐':'▶ Expedition starten'}</small></button>`}).join('')+'</div><p class="note">Präsens: 5 Aufgaben · Präteritum: 10 · Perfekt: 12 · Futur I: 10 · Finale: 15. Du darfst jede Welt so oft spielen, wie du möchtest.</p>';app.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>start(b.dataset.world));stats()}function start(id){world=worlds.find(w=>w.id===id);idx=0;score=0;render()}function render(){let q=bank[world.id][idx],total=bank[world.id].length;answered=false;app.innerHTML=`<div class="toolbar"><button class="secondary" id="back">← Zur Weltkarte</button><strong>${world.emoji} ${world.name} · Aufgabe ${idx+1}/${total}</strong></div><div class="card"><div class="progress" aria-label="Fortschritt"><div style="width:${idx/total*100}%"></div></div><div class="question-type">${q[0]==='choice'?'🔎 Wähle die richtige Antwort':'✏️ Schreibe das richtige Wort'}</div><h2 class="prompt">${escapeHTML(q[1])}</h2><div id="answerArea"></div><p class="hint">${q[0]==='input'?'Tipp: Achte auf die richtige Verbform und die Schreibweise.':'Tipp: Lies alle Antworten genau durch.'}</p><div id="feedback" aria-live="polite"></div><div class="controls"><button class="primary" id="check" disabled>Überprüfen ✓</button><button class="primary hidden" id="next">${idx===total-1?'Ergebnis ansehen 🏅':'Weiter →'}</button></div></div>`;document.getElementById('back').onclick=home;let area=document.getElementById('answerArea');if(q[0]==='choice'){area.className='options';area.innerHTML=q[2].map((v,i)=>`<button class="option" data-choice="${i}">${escapeHTML(v)}</button>`).join('');area.querySelectorAll('button').forEach(b=>b.onclick=()=>{area.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('check').disabled=false})}else{area.innerHTML='<input class="answer-input" id="input" autocomplete="off" spellcheck="false" aria-label="Deine Antwort" placeholder="Deine Antwort …" maxlength="80">';let inp=document.getElementById('input');inp.oninput=()=>document.getElementById('check').disabled=!inp.value.trim();inp.onkeydown=e=>{if(e.key==='Enter'&&!document.getElementById('check').disabled)check()};inp.focus()}document.getElementById('check').onclick=check;document.getElementById('next').onclick=()=>{idx++;idx>=total?finish():render()}}
function normalize(s){return String(s).toLocaleLowerCase('de').trim().replace(/[.!?]+$/,'').replace(/\s+/g,' ')}
function distance(a,b){let x=Array.from(a),y=Array.from(b),prev=y.map((_,j)=>j),cur=[];for(let i=1;i<=x.length;i++){cur=[i];for(let j=1;j<=y.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(x[i-1]===y[j-1]?0:1));prev=cur}return prev[y.length]}
function check(){
 if(answered)return;
 let q=bank[world.id][idx],good=false,correct=q[0]==='choice'?q[2][q[3]]:q[2],checkBtn=document.getElementById('check'),feedback=document.getElementById('feedback');
 if(q[0]==='choice'){
  let b=app.querySelector('.option.selected');if(!b)return;
  good=Number(b.dataset.choice)===q[3];app.querySelectorAll('.option').forEach(x=>x.disabled=true);
 }else{
  let input=document.getElementById('input'),v=normalize(input.value),valid=[q[2],...(q[3]||[])].map(normalize);
  good=valid.includes(v);
  if(!good){
   let close=valid.some(a=>{let d=distance(v,a);return a.length>=4&&v.length>=3&&d===1});
   if(close){
    feedback.innerHTML='<div class="feedback" style="background:#fff0bc;border:2px solid #dfa532;color:#65440b">🟡 Fast richtig! Die Zeitform könnte stimmen. Schau dir die <strong>Schreibweise</strong> noch einmal genau an und verbessere deine Antwort. Du verlierst dafür keinen Stern.</div>';
    input.focus();input.select();return;
   }
  }
  input.disabled=true;
 }
 answered=true;if(good)score++;
 feedback.innerHTML=`<div class="feedback ${good?'good':'bad'}">${good?'🎉 Richtig! Super gemacht!':'💡 Noch nicht ganz. Richtig ist: <strong>'+escapeHTML(correct)+'</strong>.'}<br>${escapeHTML(q[4])}</div>`;
 checkBtn.classList.add('hidden');document.getElementById('next').classList.remove('hidden');document.getElementById('next').focus()
}
function finish(){let total=bank[world.id].length,stars=score===total?3:score>=Math.ceil(total*.75)?2:score>=Math.ceil(total*.5)?1:0;let old=progress[world.id]||{stars:0};progress[world.id]={done:true,stars:Math.max(stars,old.stars)};save();app.innerHTML=`<div class="card result"><div class="big">${stars===3?'🏆':stars>=1?'🎉':'💪'}</div><h2>${stars===3?'Fantastische Zeitreise!':stars>=1?'Welt geschafft!':'Weiter üben lohnt sich!'}</h2><p>Du hast <strong>${score} von ${total}</strong> Aufgaben richtig gelöst.</p><p style="font-size:32px">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</p><p>${stars===3?'Alle Aufgaben richtig! Du bist ein Zeitformen-Profi.':'Du kannst diese Welt jederzeit wiederholen und noch mehr Sterne sammeln.'}</p><div class="controls" style="justify-content:center;flex-wrap:wrap"><button class="secondary" id="retry">↻ Noch einmal spielen</button><button class="primary" id="home">Zur Weltkarte →</button></div></div>`;document.getElementById('retry').onclick=()=>start(world.id);document.getElementById('home').onclick=home}document.getElementById('reset').onclick=()=>{if(confirm('Möchtest du wirklich alle gesammelten Sterne und Erfolge löschen?')){progress={};save();home()}};home();
</script><footer style="text-align:center;padding:12px 20px 24px;font:13px system-ui,sans-serif"><a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></footer></body></html>
